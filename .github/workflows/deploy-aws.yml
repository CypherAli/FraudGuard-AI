name: Deploy Backend to AWS EC2

on:
  push:
    branches: [main, backendcore]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

env:
  GO_VERSION: '1.24'
  IMAGE_NAME: fraudguard-api

jobs:
  # ── Job 1: Build & Test ─────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/api-gateway/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-w -s" -o /dev/null ./cmd/api

      - name: go vet
        run: go vet ./...

  # ── Job 2: Build Docker Image & Push to ECR ─────────────────────────────────
  docker:
    name: Docker Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/backendcore'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            services/api-gateway/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build-image

  # ── Job 3: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    environment: production   # Requires manual approval in GitHub (optional)

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}     # typically: ec2-user or ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # PEM key content (not path)
          port: 22
          # Pull latest image and restart container with zero-downtime
          script: |
            set -e

            # Login to ECR from EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest image
            docker pull ${{ secrets.ECR_REGISTRY }}/fraudguard-api:latest

            # Graceful restart: stop old → start new (< 2s downtime)
            docker stop fraudguard-api 2>/dev/null || true
            docker rm   fraudguard-api 2>/dev/null || true

            docker run -d \
              --name fraudguard-api \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/${{ secrets.EC2_USER }}/fraudguard/.env \
              --log-driver awslogs \
              --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
              --log-opt awslogs-group=/fraudguard/api \
              --log-opt awslogs-stream=api-$(date +%Y%m%d) \
              ${{ secrets.ECR_REGISTRY }}/fraudguard-api:latest

            # Health check — wait up to 30s
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/health; then
                echo "✅ Health check passed"
                break
              fi
              echo "⏳ Waiting for service... ($i/10)"
              sleep 3
            done

            # Remove dangling images to save disk space (t2.micro has 8GB root)
            docker image prune -f
